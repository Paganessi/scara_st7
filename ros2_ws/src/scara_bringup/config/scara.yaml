# =============================================================================
# scara.yaml — TODO lo calibrable del SCARA vive aquí.
# Cambiar un valor = relanzar, NO recompilar ni reflashear.
# "/**" = estos parámetros los leen TODOS los nodos (bridge, homing, ...).
# Unidades SI (REP 103): rad para θ1/θ2, metros para s3. Duty en ‰ (−1000…1000).
# Índices de las listas: [θ1 (joint1), θ2 (joint2), Z (joint3)].
# =============================================================================
/**:
  ros__parameters:
    joint_names: ["joint1", "joint2", "joint3"]
    # Juntas con motor instalado. Hoy solo θ1 (J2 y J3: motores aún no conseguidos).
    # Activar una junta = poner true aquí y relanzar.
    # Deshabilitada: el bridge la mantiene frenada, el homing la salta, goto no la espera.
    joints_enabled: [true, false, false]

    # ---------------- Transmisión ----------------
    counts_per_motor_rev: 64                 # encoder Pololu 37D, x4 (ficha ✓)
    # θ1: valor inicial 50:1 con polea 2:1 → TODO CONFIRMAR midiendo en el robot (calibrate_joint).
    gear_ratio: [50.0, 50.0, 50.0]           # TODO CONFIRMAR con la etiqueta / calibrate_joint
    transmission_ratio: [2.0, 2.0, 1.0]      # TODO CONFIRMAR: GT2 16T→32T en θ1/θ2; Z directo al husillo
    lead_mm_per_rev: 1.0                     # TODO CONFIRMAR paso del husillo M6 (grueso = 1.0 mm)
    # +1 si al SUBIR las cuentas sube el valor articular (θ o s3), −1 si baja.
    # Se decide en la Fase 1 junto con MOTOR_INVERT/ENCODER_INVERT del firmware.
    joint_sign: [1, 1, 1]                    # TODO CONFIRMAR en Fase 1
    # Calibración MEDIDA (la escribe `ros2 run scara_tools calibrate_joint`). Si es > 0 manda
    # sobre gear_ratio·transmission_ratio. 0.0 = sin calibrar (se usa el cálculo de arriba).
    counts_per_rad: [0.0, 0.0]               # θ1, θ2 (cuentas por radián)
    counts_per_m: 0.0                        # Z (cuentas por metro)

    # ---------------- Límites articulares ----------------
    # Límites de SOFTWARE = ángulo MEDIDO en que se activa cada final ±3° hacia adentro; el final
    # físico queda solo como respaldo. θ1: TODO CONFIRMAR con `measure_joint limits 1`
    # (hasta medir, ±90° del CAD). θ2 ±140° (CAD). Z: carrera TODO CONFIRMAR.
    lower_limits: [-1.5708, -2.4435, 0.0]
    upper_limits: [1.5708, 2.4435, 0.120]

# -----------------------------------------------------------------------------
scara_bridge:
  ros__parameters:
    keepalive_hz: 50.0          # ≥ 20 Hz exigido por el watchdog de 500 ms del ESP32
    raw_cmd_timeout: 0.2        # s: /scara/raw_cmd más nuevo que esto tiene prioridad
    require_homed: true         # rechazar metas sin homing (false SOLO para pruebas)
    max_velocity: [0.5, 0.5, 0.003]   # rampa del setpoint: rad/s, rad/s, m/s (Z ~3.3 mm/s máx.)
    # PID que el bridge le manda al ESP32 (modos 4–6). Unidades en config.h:
    #   kp: ‰/cuenta ×1000 · ki: ‰/(cuenta·s) ×1000 · kd: ‰/(cuenta/s) ×1000
    # J1: SIMULACIÓN — no medido en el robot. Punto de partida: TODO re-validar en el robot
    #     (Fase 3: deadzone_test + step_test).
    # J2, J3: valores de arranque (deshabilitadas).
    pid_kp_milli: [2000, 1000, 1000]
    pid_ki_milli: [0, 0, 0]
    pid_kd_milli: [10, 0, 0]
    duty_min: [72, 0, 0]              # compensación de zona muerta (≈ 0.8 × duty de arranque)
    duty_max: [600, 600, 600]         # ≤ 800 (tope duro en el firmware): corriente del TB6612

# -----------------------------------------------------------------------------
scara_homing:
  ros__parameters:
    homing_order: [3, 2, 1]           # Z primero (subir herramienta), luego θ2, luego θ1
    # Final de home por junta. θ1 = FC1_MIN (DECIDIDO). θ2: TODO. Z: el final de ARRIBA (TODO).
    home_switch: ["MIN", "MIN", "MIN"]
    # Valor articular (SI) de la junta cuando pisa su final de home. SE MIDE, no se supone:
    # homing con home_offset = 0 → llevar la junta a la marca de θ = 0 (brazo recto, cero DH)
    # → `measure_joint home-offset 1` escribe −N (en SI) → re-homing y `--check` ≈ 0 cuentas.
    # θ1: TODO CONFIRMAR (el −1.5708 es un supuesto hasta medirlo). θ2, Z: TODO.
    home_offset: [-1.5708, -2.4435, 0.0]
    homing_fast: [350, 350, 500]      # ‰ primera aproximación          TODO ajustar (≥ duty de arranque)
    homing_slow: [250, 250, 350]      # ‰ segunda aproximación y backoff TODO ajustar (≥ duty de arranque)
    backoff_counts: [180, 180, 3200]  # ≈ 10°, 10°, 1 mm con la transmisión supuesta
    homing_timeout_s: [20.0, 20.0, 90.0]   # por fase; Z es lento (husillo, ~3.3 mm/s a full)
    go_to_rest: true
    rest_pose: [0.0, 0.0, 0.0]        # θ1 = 0 rad (DECIDIDO). θ2, Z: TODO (rad, rad, m)

# -----------------------------------------------------------------------------
# Simulador (solo con use_fake:=true). Describe el HARDWARE simulado, no lo que ROS cree:
# así se puede probar qué pasa si el YAML de arriba no coincide con la realidad.
scara_esp32_fake:
  ros__parameters:
    motor_present: [true, false, false]           # hoy solo θ1 tiene motor
    plant_vmax_counts_s: [10667.0, 10667.0, 10667.0]   # 64 cuentas × ~10 000 rpm / 60
    plant_tau_s: [0.03, 0.03, 0.05]               # constante de tiempo mecánica
    plant_deadzone_permille: [80.0, 80.0, 120.0]  # duty que no alcanza a mover
    encoder_noise_counts: 0.6                     # parpadeo de ±1 cuenta
    switch_min: [-1.5708, -2.4435, 0.0]           # dónde están físicamente los finales (SI)
    switch_max: [1.5708, 2.4435, 0.120]
    switch_jitter_counts: 2.0                     # dispersión del punto de disparo
    hard_stop_margin_counts: 150.0                # tope mecánico más allá del final
    start_position: [0.35, 0.5, 0.03]             # dónde "se enciende" el robot (SI)
    seed: 0                                       # 0 = aleatorio; fijo = repetible
